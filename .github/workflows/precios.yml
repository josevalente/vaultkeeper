# Fills TCGplayer prices that TCGdex doesn't have yet (new sets) from TCGCSV, once a day.
# The result is published on the `datos` branch (data/precios-extra.json) so it never conflicts
# with your pushes to main; the app reads it from raw.githubusercontent.com.
name: Precios faltantes

on:
  schedule:
    - cron: '15 21 * * *' # daily, after TCGCSV's ~20:00 UTC update
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/precios.yml'

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas del cruce de cartas
        run: node tests/match.test.mjs

      - name: Buscar precios faltantes en TCGCSV
        run: node scripts/precios-faltantes.mjs --out "$RUNNER_TEMP/precios-extra.json"

      - name: Publicar en la rama datos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          dir="$RUNNER_TEMP/datos"
          mkdir -p "$dir/data"
          cp "$RUNNER_TEMP/precios-extra.json" "$dir/data/precios-extra.json"
          cd "$dir"
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios-extra.json
          git commit -q -m "Precios faltantes $(date -u +%F)"
          # One commit only (history isn't needed): replace the branch each day.
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
          echo "Publicado: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/datos/data/precios-extra.json"
