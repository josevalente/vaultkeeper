# Once a day, from TCGCSV (daily mirror of TCGplayer, English + Japanese Pokémon):
#  · data/precios-extra.json — prices TCGdex doesn't have yet (new sets);
#  · data/hist/*.json — daily price history of every card/product worth US$5 or more;
#  · data/catalogo/jp.json, data/catalogo/sellados.json — Japanese cards and sealed products.
# Published on the `datos` branch so it never conflicts with your pushes to main; the app reads
# it from raw.githubusercontent.com.
name: Precios faltantes

on:
  schedule:
    - cron: '15 21 * * *' # daily, after TCGCSV's ~20:00 UTC update
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/precios.yml'

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pruebas
        run: |
          node tests/match.test.mjs
          node tests/historial.test.mjs
          node tests/calc.test.mjs
          node tests/features.test.mjs

      - name: Traer la rama datos (con el historial acumulado)
        run: |
          set -e
          dir="$RUNNER_TEMP/datos"
          # Only an explicit "branch doesn't exist" (exit 2) starts from scratch. Any other error
          # (network, GitHub 5xx) stops here: otherwise the accumulated history would be replaced.
          set +e
          git ls-remote --exit-code --heads origin datos >/dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 -b datos "https://github.com/${GITHUB_REPOSITORY}.git" "$dir"
            ls "$dir/data/hist"/*.json >/dev/null 2>&1 || { echo "La rama datos existe pero no trae historial: aborto para no borrarlo"; exit 1; }
          elif [ "$rc" -eq 2 ]; then
            echo "La rama datos aún no existe: parto de cero"
            mkdir -p "$dir"
          else
            echo "No pude consultar la rama datos (código $rc): aborto sin publicar"
            exit 1
          fi
          rm -rf "$dir/.git"
          mkdir -p "$dir/data"

      - name: Precios faltantes de expansiones nuevas
        run: node scripts/precios-faltantes.mjs --out "$RUNNER_TEMP/datos/data/precios-extra.json"

      - name: Historial, cartas japonesas y sellados
        run: node scripts/tcgcsv-diario.mjs --data "$RUNNER_TEMP/datos/data"

      - name: Publicar en la rama datos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$RUNNER_TEMP/datos"
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Precios $(date -u +%F)"
          # The history lives in the files; one commit is enough, so the branch is replaced each day.
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
          echo "Publicado en https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/datos/data/"
