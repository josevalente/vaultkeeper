<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>VaultKeeper · ¿Qué cartas manejas?</title>
  <meta name="theme-color" content="#0c0f16" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VaultKeeper">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="chooser">
  <main class="choose">
    <div class="choose-head">
      <img src="icons/icon-192.png" alt="" width="64" height="64">
      <h1>Vault<em>Keeper</em></h1>
      <p>¿Qué cartas quieres manejar?</p>
      <p class="muted small">Elige una o varias. Cada juego tiene su propio vault, separado de los demás. Puedes agregar o quitar juegos cuando quieras en <b>Más → Vaults</b>.</p>
    </div>
    <div class="choose-list" role="group" aria-label="Juegos"></div>
    <button class="btn primary full start" disabled>Elige al menos uno</button>
  </main>
  <script type="module" src="js/elegir.js"></script>
</body>
</html>
